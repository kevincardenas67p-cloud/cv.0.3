<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Página de contacto de Kevin Santiago Cárdenas Caro.">

    <title>Contacto - Kevin Santiago Cárdenas Caro</title>
      <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="contacto.css"
</head>

<body>

    <header>
        <h1>Contacto</h1>

        <p>Formulario para ponerse en contacto conmigo</p>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="proyectos.html">Proyectos</a>
            <a href="articulos.html">Artículos</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>

    <main>

        <section>
            <h2>Contáctame</h2>

            <p>
                Si deseas comunicarte conmigo, puedes completar
                el siguiente formulario.
            </p>
        </section>

        <section>
            <h2>Formulario de contacto</h2>

            <form action="#" method="post">

                <p>
                    <label for="nombre">Nombre:</label>
                    <br>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        required>
                </p>

                <p>
                    <label for="correo">Correo electrónico:</label>
                    <br>
                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        required>
                </p>

                <p>
                    <label for="mensaje">Mensaje:</label>
                    <br>
                    <textarea
                        id="mensaje"
                        name="mensaje"
                        rows="8"
                        cols="40"
                        required></textarea>
                </p>

                <p>
                    <button type="submit">Enviar</button>
                </p>

            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Kevin Santiago Cárdenas Caro</p>
    </footer>

</body>
</html>
